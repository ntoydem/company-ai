[project]
name = "company-ai-backend"
version = "0.1.0"
description = "Company AI V0 backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "openai>=3.17,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # seed_data/t0/generate.py only (Phase 0.2 demo fixtures) — not used at runtime.
    "weasyprint>=62",
    "pymupdf>=1.24",
    "jinja2>=3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# local ./alembic directory must not shadow the alembic package
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not live_llm'"
markers = ["live_llm: calls the real LLM (make test-llm); excluded from make test"]
filterwarnings = ["error::DeprecationWarning:app.*"]
