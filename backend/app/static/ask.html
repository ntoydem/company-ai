<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company AI — AI'ya Sor (test)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --text:#1f2933; --muted:#6b7280; --accent:#1d4ed8; --ok:#047857; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .notice { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; min-height:64px; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit; resize:vertical; }
  button { padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .examples { margin:8px 0 20px; font-size:.9rem; }
  .examples a { color:var(--accent); margin-right:12px; cursor:pointer; text-decoration:underline; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:16px; }
  h2 { font-size:1rem; margin:0 0 8px; }
  .answer { white-space:pre-wrap; line-height:1.5; }
  .answer.no { color:var(--muted); }
  .card { border-top:1px solid var(--line); padding:10px 0; font-size:.92rem; }
  .card:first-of-type { border-top:0; }
  .ref { display:inline-block; min-width:2.2em; font-weight:600; color:var(--accent); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; background:#d1fae5; color:var(--ok); font-size:.78rem; margin-left:6px; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:8px; }
  .error { color:#b91c1c; }
</style>
</head>
<body>
<main>
  <h1>AI'ya Sor <small style="font-weight:normal;color:var(--muted)">(Phase 0.3 test sayfası)</small></h1>
  <p class="notice" id="notice">Bu cevap yorum içermez; yalnızca şirket belgelerinde yazanı kaynak göstererek aktarır.</p>
  <form id="form">
    <textarea id="q" placeholder="Sorunuzu yazın" required minlength="3" maxlength="1000"></textarea>
    <button id="btn" type="submit">Sor</button>
  </form>
  <div class="examples">Örnek:
    <a data-q="Ankara RES'in güncel minimum DSCR covenant'ı nedir?">güncel DSCR</a>
    <a data-q="İlk DSCR covenant neydi?">ilk DSCR</a>
    <a data-q="İzmir RES'in COD tarihi nedir?">İzmir COD</a>
    <a data-q="Ankara RES kredisinin güncel vadesi kaç yıl?">güncel vade</a>
  </div>
  <section id="out" hidden>
    <h2>Cevap</h2>
    <div class="answer" id="answer"></div>
    <h2 style="margin-top:16px">Kaynaklar</h2>
    <div id="sources"></div>
    <div class="meta" id="meta"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const fmtDate = (iso) => iso ? iso.split("-").reverse().join(".") : "-";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  document.querySelectorAll(".examples a").forEach((a) => a.addEventListener("click", () => { $("q").value = a.dataset.q; $("form").requestSubmit(); }));

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = $("q").value.trim();
    if (!question) return;
    $("btn").disabled = true;
    $("out").hidden = false;
    $("answer").className = "answer";
    $("answer").textContent = "Aranıyor…";
    $("sources").innerHTML = "";
    $("meta").textContent = "";
    try {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const body = await response.json();
      if (!response.ok) {
        const detail = typeof body.detail === "string" ? body.detail : (body.detail && body.detail.message) || "Hata";
        $("answer").innerHTML = `<span class="error">${esc(detail)}</span>`;
        $("meta").textContent = body.request_id ? `request_id: ${body.request_id}` : "";
        return;
      }
      $("answer").textContent = body.answer;
      if (!body.answered) $("answer").classList.add("no");
      if (body.notice) $("notice").textContent = body.notice;
      if (!body.sources.length) {
        $("sources").innerHTML = '<div class="card" style="color:var(--muted)">Kaynak yok.</div>';
      }
      for (const s of body.sources) {
        const chain = s.supersedes_title ? ` · "${esc(s.supersedes_title)}" belgesini değiştirir` : "";
        const after = s.superseded_by_title ? ` · "${esc(s.superseded_by_title)}" tarafından değiştirilmiş` : "";
        $("sources").insertAdjacentHTML("beforeend", `
          <div class="card">
            <span class="ref">[${esc(s.ref)}]</span> <strong>${esc(s.title)}</strong>
            ${s.is_current ? '<span class="badge">GÜNCEL</span>' : ""}<br>
            Sayfa ${s.page_number} · Tarih ${fmtDate(s.document_date)} · Yürürlük ${fmtDate(s.effective_date)} ·
            Versiyon ${s.version} · Durum ${esc(s.status)}${chain}${after}
          </div>`);
      }
      $("meta").textContent = `model: ${body.model || "-"} · token giriş/çıkış: ${body.tokens_in}/${body.tokens_out} · request_id: ${response.headers.get("x-request-id") || "-"}`;
    } catch (err) {
      $("answer").innerHTML = '<span class="error">Sunucuya ulaşılamadı.</span>';
    } finally {
      $("btn").disabled = false;
    }
  });
</script>
</body>
</html>
