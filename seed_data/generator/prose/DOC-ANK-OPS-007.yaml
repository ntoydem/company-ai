model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: Genel Değerlendirme
  paragraphs:
  - Bu belge, [[project_name]] kapsamındaki üretim faaliyetlerine ilişkin dönem sonuçlarını
    özetleyen [[title]] başlıklı rapordur. Rapor, [[document_no]] numarası ve [[version_label]]
    sürüm etiketiyle düzenlenmiş olup [[document_date]] tarihlidir.
  - Raporun hazırlanmasında sorumlu proje şirketi [[spv_name]] olarak belirtilmiştir.
    Belgenin mevcut durumu [[status_label]] olarak kayıtlıdır.
  - Rapor, ilgili tarafların bilgilendirilmesi amacıyla hazırlanmıştır. Bilgilendirilen
    taraflar [[parties_list]] olarak kayıt altına alınmıştır.
- heading: Performans Özeti
  paragraphs:
  - Raporlama dönemi boyunca tesisin toplam üretim miktarı [[mwh]] olarak kaydedilmiştir.
    Bu değer, dönem içinde şebekeye verilen enerjiyi esas almaktadır.
  - Üretim sonuçları, tesisin olağan işletme koşulları altındaki genel seyrini yansıtmaktadır.
    Ayrıntılı teknik değerlendirmeler ve sapma analizleri gerektiğinde ayrıca ele
    alınacaktır.
  - Bu özet, [[project_name]] için izleme ve raporlama süreçlerinin bir parçasıdır.
    Sonraki dönem raporlarında aynı çerçeve esas alınarak karşılaştırmalı değerlendirme
    yapılabilecektir.
