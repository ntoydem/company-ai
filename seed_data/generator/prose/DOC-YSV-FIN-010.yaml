  - The parties connected with this reporting obligation are [[parties_list]]. The
    relevant counterparties for the purposes of this report are [[counterparty_list]].
- heading: 2. Compliance Summary
  paragraphs:
  - For the reporting year [[annex_f_reporting_year]], the debt service coverage ratio
    is recorded as [[dscr]]. Interest paid during the period amounts to [[interest_paid]].
    The covenant test result is recorded as [[covenant_result]].
  - The position with respect to [[counterparty]] is reflected in the figures above
    and is presented on the basis of the information available at the date of this
    draft.
  - The document [[missing_guarantee_letter_name]] is still outstanding and has not
    yet been submitted. Until it is provided, the compliance position in this draft
    should be regarded as incomplete.
