model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: Bütçe Kapsamı
  paragraphs:
  - Bu belge, [[project_name]] kapsamında yürütülecek geliştirme faaliyetlerine ilişkin
    bütçenin onaylanmasını konu alır. Belge, [[document_no]] numarası ve [[version_label]]
    sürümü ile kayıt altına alınmış olup [[document_date]] tarihlidir.
  - Bütçe, proje geliştirme sürecinin ön hazırlık, izin, etüt ve saha çalışmalarına
    ilişkin giderlerini genel hatlarıyla kapsar. Bu faaliyetlerin yürütülmesinden
    proje şirketi [[spv_name]] sorumludur.
  - Bütçe kalemlerinin ayrıntıları ve tutarları, ilgili ekler ve taraflarca kabul
    edilen diğer proje belgelerinde yer alır. Söz konusu kalemlerin yönetimi, tarafların
    mutabık kaldığı esaslar çerçevesinde ve proje ihtiyaçlarına uygun biçimde gerçekleştirilir.
- heading: Onay
  paragraphs:
  - Bu bütçe, [[parties_list]] tarafından incelenmiş ve belge başlığında yer alan
    [[title]] kapsamında onaya sunulmuştur. Belgenin güncel durumu [[status_label]]
    olarak kayıtlıdır.
  - Onay, [[effective_date]] tarihinden itibaren geçerli olur. Bu tarihten itibaren
    bütçe, proje geliştirme faaliyetlerinin yürütülmesinde esas alınacak çerçeveyi
    oluşturur.
  - Bütçede yapılacak değişiklikler ve ek ihtiyaçlar, taraflar arasında yazılı olarak
    değerlendirilir ve ilgili onay süreçlerine tabi tutulur. Bu belge, kurgusal bir
    demo çalışması olup gerçek bir taahhüt oluşturmaz.
