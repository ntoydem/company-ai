doc_id: DOC-ANK-FIN-013
model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Assignment of Insurance Proceeds
  paragraphs:
  - This [[title]] (reference [[document_no]], [[version_label]], currently [[status_label]])
    is dated [[document_date]] and takes effect on [[effective_date]]. It records
    the arrangements under which [[spv_name]] assigns the benefit of the insurance
    proceeds relating to [[project_name]] in favour of [[counterparty]].
  - The assignment covers the proceeds payable under the insurance policies maintained
    for [[project_name]], to the extent provided in the transaction documentation.
    [[spv_name]] shall continue to maintain such policies in accordance with the obligations
    it has undertaken toward [[counterparty_list]].
  - Proceeds received by [[spv_name]] in respect of the assigned policies shall be
    applied in the manner agreed with [[counterparty]]. Any matter not expressly addressed
    in this Section shall be resolved in line with the general principles of the transaction
    documentation.
- heading: 2. Governing Law
  paragraphs:
  - This Agreement and any non-contractual matters arising from it are governed by
    the law agreed between [[spv_name]] and [[counterparty]] in the transaction documentation.
    The parties intend the governing law to apply consistently across all documents
    forming part of the same financing arrangement.
  - Disputes arising in connection with this Agreement shall be addressed through
    the dispute resolution arrangements agreed among [[counterparty_list]] and [[spv_name]].
    Nothing in this Section limits the rights of the parties under those arrangements.
