hand_edited: >-
  Phase 3.2c (25.09.2026) -- icerik boslugu kapatan cumleler elle eklendi; Adim 5 Asama
  C.5 (10.10.2026) -- local_debt/eca_debt rakamlari kaldirildi, kasitli celiski (14,0 vs
  13,6 mn) belge-ici cumleyle degil FIN-004 (14,0M) ile FIN-007/odeme plani (13,6M)
  arasinda kalsin diye (Tansu'nun gercek celiski tanimina uysun -- iki guncel kaynak
  farkli deger verir); generate_prose bu dosyayi --force ile bile yeniden uretmez
sections:
- heading: 1. Definitions and Interpretation
  paragraphs:
  - This document sets forth the terms regarding the agreement made by [[parties_list]]
    under reference [[document_no]]. The interpretation of terms herein shall align
    with the official definitions established for [[project_name]].
  - References to specific dates shall be governed by [[document_date]] and [[effective_date]].
    Each party acknowledges the status indicated by [[status_label]] and the corporate
    structure of [[spv_name]].
- heading: 2. The Facility
  paragraphs:
  - The total financial accommodation provided to [[spv_name]] is structured as [[total_debt]].
    The entire facility is provided by [[counterparty]] as the local bank; no separate
    export credit agency (ECA) tranche forms part of this structure.
  - The applicable interest rate shall be determined by the baseline index plus [[margin_pct]].
    Funds shall be disbursed in accordance with the milestones established for [[project_name]].
- heading: 3. Conditions Precedent
  paragraphs:
  - Utilization of the facility remains subject to the satisfaction of conditions
    precedent by [[counterparty]]. These prerequisites ensure full compliance with
    the framework of [[project_name]].
  - Legal opinions and corporate authorizations must be delivered prior to [[effective_date]].
    Financial close is scheduled for [[financial_close_date]] upon satisfaction of these
    conditions. Failure to meet these criteria may result in a revision of [[status_label]].
- heading: 4. Repayment and Prepayment
  paragraphs:
  - The repayment schedule shall commence following the expiry of [[grace_months]].
    The overall tenor of the facility is strictly defined as [[tenor_years]].
  - Early repayment options are available to [[spv_name]] subject to prior notice
    given to [[counterparty]]. Any voluntary prepayment shall incur standard administrative
    review under the agreement.
- heading: 5. Financial Covenants
  paragraphs:
  - The borrower must maintain a minimum debt service coverage ratio (DSCR) of
    [[dscr_covenant]]. Compliance with this DSCR covenant will be tested at each
    reporting period.
  - Any breach of the specified financial covenants shall constitute an event of default.
    [[counterparty]] reserves the right to review the facility status upon such occurrence.
- heading: 6. Representations and Warranties
  paragraphs:
  - '[[spv_name]] hereby represents and warrants its legal capacity to enter into
    [[document_no]]. All information provided regarding [[project_name]] remains accurate
    and complete.'
  - These representations are deemed repeated on each drawdown date under the agreement.
    [[counterparty]] relies upon these statements in maintaining the facility.
- heading: 7. Governing Law
  paragraphs:
  - This agreement and any contractual obligations arising from it shall be governed
    by applicable law. Jurisdiction is irrevocably granted to the competent courts
    designated by [[counterparty]].
  - Disputes arising in connection with [[document_no]] shall be resolved through
    formal legal channels. The official language of interpretation shall be the language
    of the governing jurisdiction.
