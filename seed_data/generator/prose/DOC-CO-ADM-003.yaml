hand_edited: Adım 5 (09.10.2026) — [[ghi_share_pct]] token kaldırıldı; GHI'nin tarihsel %20'si artık
  ledger'da bir yola karşılık gelmiyor (ortaklık yapısı XYZ Enerji A.Ş. %100'e sadeleştirildi),
  bu yüzden değer düz metin olarak sabitlendi; generate_prose bu dosyayı --force ile bile
  yeniden üretmez.
sections:
- heading: Karar Gerekçesi
  paragraphs:
  - Şirketimiz [[spv_name]] bünyesinde yürütülen stratejik büyüme faaliyetleri kapsamında
    [[counterparty]] ile iş birliği yapılması planlanmaktadır.
  - Ortaklık yapısının güçlendirilmesi ve pazar payının artırılması amacıyla [[parties_list]]
    arasında müzakereler tamamlanmıştır.
  - İlgili yatırımların [[effective_date]] tarihi itibarıyla hayata geçirilmesi ve
    gerekli yasal süreçlerin başlatılması zorunludur.
- heading: Alınan Karar
  paragraphs:
  - Yönetim kurulu tarafından yapılan değerlendirmeler neticesinde %20
    oranındaki hisse devri oy birliğiyle kabul edilmiştir.
  - İşbu [[document_no]] numaralı karar belgesinde belirtilen tüm şartların yerine
    getirilmesi hususunda genel müdürlük yetkilendirilmiştir.
  - Alınan kararların [[status_label]] statüsünde yürürlüğe konulması ve ilgili resmi
    kurumlara bildirilmesi kararlaştırılmıştır.
