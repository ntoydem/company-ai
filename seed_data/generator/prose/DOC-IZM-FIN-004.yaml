model: gemini-3.5-flash
tag: AI_ASSUMPTION
sections:
- heading: 1. Definitions and Interpretation
  paragraphs:
  - This facility agreement, bearing document reference [[document_no]] and titled
    [[title]], is entered into as of [[document_date]] and becomes effective on [[effective_date]].
    It establishes the core financial terms and obligations between the entities listed
    under [[parties_list]], including [[spv_name]] and [[counterparty]].
  - The agreement governs the overall framework for [[project_name]] with current
    status designated as [[status_label]]. All terms and interpretation principles
    set forth in this text shall be applied in accordance with document version [[version_label]].
- heading: 2. The Facility
  paragraphs:
  - Under the terms of this agreement, the lenders make available to [[spv_name]]
    a facility in an aggregate limit of [[total_debt]]. The facility is established
    exclusively to support the financing objectives of [[project_name]].
  - The financial commitments supplied by [[counterparty]] and the participants under
    [[parties_list]] shall be utilized solely for permitted corporate purposes. The
    allocation and administration of funds remain governed by document reference [[document_no]].
- heading: 3. Conditions Precedent to Drawdown
  paragraphs:
  - The right of [[spv_name]] to issue a utilization request is subject to the prior
    satisfaction of all prerequisite conditions. A primary requirement for any disbursement
    is the full satisfaction of [[drawdown_condition]].
  - Upon verification that all conditions precedent have been met to the satisfaction
    of [[counterparty]], funds may be drawn. Failure to satisfy these requirements
    may prevent utilization under version [[version_label]].
- heading: 4. Commitment Fee
  paragraphs:
  - The borrower shall pay a commitment fee calculated by applying [[commitment_fee_rate]]
    to the unutilized portion of the commitments. The resulting fee amount is set
    as [[commitment_fee]].
  - The commitment fee shall accrue starting from [[effective_date]] and shall be
    payable on [[commitment_fee_date]]. Payments shall be processed by [[spv_name]]
    to the designated accounts of [[counterparty]].
- heading: 5. Governing Law
  paragraphs:
  - This agreement, identified as [[document_no]], and any non-contractual obligations
    arising out of it shall be governed by applicable legal standards. The relationship
    between [[spv_name]] and [[counterparty]] shall be interpreted under these governing
    principles.
  - The entities named in [[parties_list]] agree that any dispute arising under [[title]]
    shall be referred to the competent judicial forums. This clause remains effective
    for all matters concerning document version [[version_label]] and status [[status_label]].
