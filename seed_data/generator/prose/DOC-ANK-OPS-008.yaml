model: gemini-3.5-flash-lite
tag: AI_ASSUMPTION
sections:
- heading: Genel Değerlendirme
  paragraphs:
  - İşbu [[document_no]] numaralı resmi belge, [[spv_name]] tarafından yürütülen operasyonel
    süreçlerin kapsamlı bir incelemesini içermektedir. Belirtilen dönem boyunca [[project_name]]
    projesinin hedefleri doğrultusunda kaydedilen ilerlemeler [[status_label]] statüsüne
    uygun olarak detaylıca incelenmiştir.
  - Değerlendirme sürecinde [[counterparty]] ile gerçekleştirilen iş birliği faaliyetleri
    ve [[parties_list]] unsurları titizlikle ele alınmıştır. Elde edilen bulgular,
    [[effective_date]] tarihinde yürürlüğe giren politikaların başarıyla uygulandığını
    ve [[version_label]] standartlarının korunduğunu göstermektedir.
- heading: Sonuç
  paragraphs:
  - '[[document_date]] tarihinde finalize edilen bu değerlendirme notu, gelecekteki
    stratejik adımlar için sağlam bir altyapı sunmaktadır. İlgili tarafların [[title]]
    sorumluluklarını eksiksiz yerine getirmesi, operasyonel sürdürülebilirlik açısından
    kritik önem taşımaktadır.'
  - Mevcut performans seviyesinin korunması ve sürekli iyileştirme prensiplerinin
    benimsenmesi amacıyla denetim süreçleri periyodik olarak tekrarlanacaktır. Kurumsal
    hedeflere ulaşılması yolunda gösterilen uyum, tüm paydaşlar için memnuniyet verici
    düzeydedir.
