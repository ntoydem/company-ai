model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: Genel Değerlendirme
  paragraphs:
  - Bu belge, [[project_name]] kapsamında işletilen tesisin ilgili dönemdeki üretim
    faaliyetlerini özetlemek amacıyla hazırlanmıştır. Rapor, [[spv_name]] adına düzenlenmiş
    olup [[document_no]] numaralı belge olarak kayıt altına alınmıştır.
  - Belge, [[title]] başlığı altında [[version_label]] sürümü olarak yayımlanmıştır.
    Belgenin güncel durumu [[status_label]] olarak belirtilmiş, düzenleme tarihi ise
    [[document_date]] olarak kaydedilmiştir.
  - Rapor, ilgili tarafların bilgilendirilmesi amacıyla hazırlanmıştır. Bilgilendirme
    kapsamındaki taraflar [[parties_list]] ifadesiyle belirtilmiştir.
- heading: Performans Özeti
  paragraphs:
  - Raporlama dönemi boyunca tesisin toplam üretim miktarı [[mwh]] olarak kayda geçmiştir.
    Bu değer, işletme kayıtları esas alınarak derlenmiş olup dönem içi üretim performansının
    temel göstergesini oluşturmaktadır.
  - Üretim sonuçları, tesisin işletme koşulları ve dönem içindeki genel çalışma düzeni
    çerçevesinde değerlendirilmelidir. Ayrıntılı teknik analizler ve karşılaştırmalar
    gerekli görüldüğünde ayrı belgelerle sunulacaktır.
  - Bu rapor kurgusal bir demo belgesi niteliğindedir ve yalnızca gösterim amacıyla
    hazırlanmıştır. İçerdiği bilgiler gerçek bir işletmeye veya gerçek verilere ilişkin
    değildir.
