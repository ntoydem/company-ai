doc_id: DOC-ANK-FIN-012
model: gemini-3.5-flash-lite
tag: AI_ASSUMPTION
sections:
- heading: 1. Pledge of Project Accounts
  paragraphs:
  - The [[spv_name]] hereby establishes a first-ranking pledge over all project accounts
    in favor of the [[counterparty]]. This security arrangement is executed pursuant
    to the [[document_no]] and becomes fully operational as of the [[effective_date]].
  - All revenues, operational reserves, and debt service funds maintained by the [[spv_name]]
    shall be encumbered under the terms specified in the [[title]]. The [[parties_list]]
    confirm that no prior liens exist on these designated accounts as of [[document_date]].
  - During the [[status_label]] phase, withdrawals from the pledged accounts remain
    strictly subject to the prior written consent of the [[counterparty]]. The [[project_name]]
    shall maintain continuous compliance with all related financial covenants.
- heading: 2. Governing Law
  paragraphs:
  - This agreement shall be governed by and construed in accordance with the laws
    of the jurisdiction applicable to the [[project_name]]. Any disputes arising from
    the interpretation of the [[document_no]] shall be resolved through formal legal
    channels.
  - The [[parties_list]] irrevocably submit to the exclusive jurisdiction of the competent
    courts designated in the [[title]]. The [[spv_name]] and the [[counterparty]]
    acknowledge that this clause survives the termination of the [[version_label]].
  - All operational procedures regarding the pledged accounts must align with the
    regulatory framework active on the [[effective_date]]. Amendments to this governing
    provision require unanimous written consent from the [[counterparty]] and the
    [[spv_name]].
