doc_id: DOC-ANK-OPS-001
model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: Genel Değerlendirme
  paragraphs:
  - Bu rapor, [[project_name]] kapsamındaki üretim faaliyetlerinin aylık değerlendirmesini
    sunmaktadır. Belge, [[document_no]] numarası ve [[version_label]] sürümü ile [[document_date]]
    tarihinde hazırlanmıştır. Belgenin güncel durumu [[status_label]] olarak kayıtlıdır.
  - Raporda yer alan bilgiler, [[spv_name]] tarafından yürütülen işletme faaliyetlerini
    kapsamaktadır. Değerlendirme, [[operating_year]] işletme yılı çerçevesinde ve
    proje sahipliği yapısı gözetilerek yapılmıştır. İlgili taraflar [[parties_list]]
    olarak belirtilmiştir.
  - Rapor yalnızca bilgilendirme amacıyla hazırlanmış kurgusal bir demo belgesidir.
    Sunulan değerlendirmeler genel nitelikte olup, ayrıntılı teknik analizlerin yerine
    geçmez.
- heading: Performans Özeti
  paragraphs:
  - Rapor dönemi içinde tesisin toplam üretimi [[mwh]] olarak kaydedilmiştir. Bu değer,
    [[title]] başlıklı belgenin kapsadığı dönemin temel performans göstergesini oluşturmaktadır.
  - Üretim verileri, [[operating_year]] işletme yılının genel seyri ile birlikte ele
    alınmalıdır. Dönemsel farklılıklar, işletme koşullarına ve çevresel etkenlere
    bağlı olarak değişebilmektedir.
  - Performansa ilişkin değerlendirmeler, sonraki raporlama dönemlerinde de aynı çerçevede
    sürdürülecektir. Gerekli görülmesi hâlinde ilgili taraflar bilgilendirilecek ve
    belge güncellenecektir.
