model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Kullanım Hakkının Kapsamı
  paragraphs:
  - İşbu [[title]], [[document_no]] numaralı ve [[version_label]] sürümlü belge olarak,
    [[project_name]] kapsamındaki saha üzerindeki kullanım hakkının kapsamını düzenlemektedir.
    Kullanım hakkı, [[spv_name]] için tesis edilmiştir.
  - Tesis edilen hak; projenin geliştirilmesi, inşası, işletilmesi ve bakımı için
    gerekli faaliyetlerle sınırlıdır. Bu amaçların dışındaki kullanımlar hakkın kapsamına
    dahil edilmemiştir.
  - Kapsamda açıkça düzenlenmeyen hususlar, yürürlükteki mevzuat ve genel hukuk ilkeleri
    çerçevesinde değerlendirilir.
- heading: 2. Yürürlük ve Genel Hükümler
  paragraphs:
  - İşbu belge [[document_date]] tarihlidir ve [[effective_date]] tarihinde yürürlüğe
    girmiştir. Belgenin güncel durumu [[status_label]] olarak kayıtlıdır.
  - Belgede yapılacak her türlü değişiklik yazılı olarak ve usulüne uygun biçimde
    gerçekleştirilir. Hükümlerden birinin geçersiz sayılması, diğer hükümlerin geçerliliğini
    etkilemez.
  - Doğabilecek uyuşmazlıklar öncelikle iyi niyet çerçevesinde çözümlenmeye çalışılır.
    Bu mümkün olmazsa yürürlükteki mevzuata uygun yollara başvurulur.
