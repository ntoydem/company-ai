model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Kullanım Hakkının Kapsamı
  paragraphs:
  - İşbu sözleşme, [[title]] başlığıyla [[document_no]] numaralı belge olarak düzenlenmiş
    olup [[version_label]] sürümü ile [[status_label]] statüsündedir. Sözleşme, [[project_name]]
    kapsamında kullanılacak sahaya ilişkin kullanım hakkının esaslarını belirlemektedir.
  - Söz konusu kullanım hakkı, [[spv_name]] lehine [[counterparty]] tarafından tesis
    edilmiştir. Hak, proje faaliyetlerinin yürütülmesi amacıyla sınırlı olup yalnızca
    bu amaç doğrultusunda kullanılabilir.
  - Kullanım hakkının kapsamı ve usulü, taraflarca karşılıklı olarak kabul edilmiş
    ve sözleşme metninde yer alan hükümlerle belirlenmiştir. Sözleşmenin tarafları
    [[parties_list]] olarak kayıt altına alınmıştır.
- heading: 2. Yürürlük ve Genel Hükümler
  paragraphs:
  - Sözleşme, [[document_date]] tarihinde düzenlenmiş ve [[effective_date]] tarihinde
    yürürlüğe girmiştir. Taraflar, sözleşmenin imzalanmasıyla birlikte bu hükümlerle
    bağlı olduklarını kabul etmiştir.
  - Sözleşmede yapılacak her türlü değişiklik veya ek, tarafların karşılıklı mutabakatıyla
    ve yazılı olarak gerçekleştirilir. Sözleşmenin herhangi bir hükmünün uygulanamaz
    hale gelmesi, diğer hükümlerin geçerliliğini etkilemez.
  - Taraflar, sözleşmeden doğan hak ve yükümlülüklerini iyi niyet ilkelerine uygun
    biçimde yerine getirmeyi taahhüt etmiştir. Sözleşmeden doğabilecek uyuşmazlıklar
    öncelikle taraflar arasında çözüme kavuşturulmaya çalışılır.
