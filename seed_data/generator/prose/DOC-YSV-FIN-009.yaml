tag: AI_ASSUMPTION
sections:
- heading: 1. Recitals and Definitions
  paragraphs:
  - İşbu tesis sözleşmesi, [[document_date]] tarihinde [[parties_list]] arasında akdedilmiştir.
    Belge, [[title]] başlığını taşımakta olup [[document_no]] referans numarası ve
    [[version_label]] sürümü ile kayıt altına alınmıştır.
  - Sözleşmenin borçlu tarafı olan [[spv_name]], projenin yürütülmesinden sorumlu
    özel amaçlı şirkettir. Finansman sağlayan taraf olarak [[counterparty]] belirlenmiş
    olup işbu belge [[status_label]] statüsündedir.
  - İlgili finansal yapının yürürlük tarihi [[effective_date]] olarak kabul edilmiştir.
    Sözleşme kapsamındaki temel kavramlar ve taraf yükümlülükleri takip eden maddelerde
    düzenlenen esaslara tabidir.
- heading: 2. The Facility (Supplementary Financing)
  paragraphs:
  - Sağlanan ek finansman imkanı, [[project_name]] kapsamında ihtiyaç duyulan yatırımların
    desteklenmesini amaçlamaktadır. Kredi tesisi çerçevesinde tahsis edilen toplam
    borç tutarı [[total_debt]] olarak belirlenmiştir.
  - Projenin toplam sermaye harcaması [[capex]] tutarında öngörülmektedir. Söz konusu
    harcamaların finansmanı amacıyla taahhüt edilen özkaynak katkısı [[equity]] seviyesindedir.
  - Kredi kullanımında uygulanacak marj oranı [[margin_pct]] olarak uygulanacaktır.
    Kullanım şartları ve ek finansman tahsis esasları genel kredi koşullarına göre
    yürütülecektir.
- heading: 3. Repayment
  paragraphs:
  - Anapara ve faiz ödemeleri, taraflarca kararlaştırılan [[repayment_profile]] doğrultusunda
    gerçekleştirilecektir. Borçlu, belirlenen ödeme takvimine uygun hareket etmekle
    mükelleftir.
  - Ödemelerin zamanında yapılması esas olup vadeler borçlanma şartlarına tabi olacaktır.
    Erken ödemeler veya takvim değişiklikleri genel sözleşme hükümleri çerçevesinde
    değerlendirilir.
- heading: 4. Financial Covenants
  paragraphs:
  - Borçlu, kredi süresi boyunca belirli finansal rasyoları sağlamak ve korumakla
    yükümlüdür. Bu kapsamda uyulması gereken borç servis kapsama oranı taahhüdü [[dscr_covenant]]
    olarak belirlenmiştir.
  - Finansal vaatlerin takibi amacıyla borçlu tarafından düzenli raporlama yapılacaktır.
    Taahhütlerin ihlali durumunda genel sözleşme hükümleri ve ilgili mevzuat esas
    alınır.
- heading: 5. Governing Law
  paragraphs:
  - İşbu sözleşme ve sözleşmeden doğan tüm hak ve yükümlülükler genel hukuk kurallarına
    tabidir. Taraflar, doğabilecek uyuşmazlıkların çözümünde yetkili hukukun uygulanacağını
    kabul ederler.
  - Sözleşme hükümlerinin uygulanmasında ve yorumlanmasında ilgili mevzuat esas alınır.
    Sözleşmede yapılacak her türlü değişiklik tarafların yazılı mutabakatına bağlıdır.
