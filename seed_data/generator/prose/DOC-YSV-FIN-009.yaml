model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Recitals
  paragraphs:
  - This agreement, titled [[title]] and registered as [[document_no]], is dated [[document_date]]
    and is made between [[parties_list]]. It is issued as [[version_label]] and carries
    the status [[status_label]].
  - '[[spv_name]] owns and operates the [[project_name]], whose total capital expenditure
    amounts to [[capex]]. The plant was constructed and brought into operation before
    this Facility existed.'
  - The Facility is a subsequent, partial term loan extended by [[counterparty]] in
    relation to the plant. It is documented on the terms set out in this Agreement.
- heading: 2. The Facility
  paragraphs:
  - The Facility is a term loan made available to [[spv_name]] under this Agreement
    with effect from [[effective_date]]. The total debt amount referred to in this
    Agreement is [[total_debt]].
  - Interest on the Facility accrues at the applicable reference rate plus a margin
    of [[margin_pct]]. Further details of interest and payment mechanics are governed
    by the operative provisions of this Agreement.
- heading: 3. Repayment
  paragraphs:
  - 'The Facility shall be repaid in accordance with the following repayment profile:
    [[repayment_profile]]. The Borrower shall make each repayment in line with that
    profile and the payment provisions of this Agreement.'
  - Any matter relating to repayment that is not expressly addressed in this section
    shall be dealt with under the general terms of this Agreement.
- heading: 4. Financial Covenants
  paragraphs:
  - The Borrower undertakes to comply with the debt service coverage covenant of [[dscr_covenant]].
    Compliance shall be assessed in the manner provided for in this Agreement.
  - The Borrower shall provide the financial information reasonably required to verify
    compliance with this covenant. The consequences of any non-compliance are as set
    out in the general provisions of this Agreement.
- heading: 5. Governing Law
  paragraphs:
  - This Agreement and any non-contractual obligations arising from it are governed
    by the law agreed between the parties in the executed version of the Agreement.
  - Disputes arising in connection with this Agreement shall be resolved in accordance
    with the dispute resolution provisions agreed between the parties.
