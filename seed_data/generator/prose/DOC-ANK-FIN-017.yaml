sections:
- heading: Faiz Oranı Belirleme
  paragraphs:
  - Sayın [[spv_name]], [[project_name]] kapsamında [[counterparty]] tarafından
    kullandırılan kredi için güncel dönem faiz oranı belirlenmiştir. Taban endeks
    üzerine uygulanan marj [[margin_pct]] olarak teyit edilmektedir.
  - Bu bildirim [[document_no]] referans numarası ile [[document_date]] tarihinde
    düzenlenmiştir ve [[spv_name]] ile [[counterparty]] arasındaki finansman
    sözleşmesi kapsamındaki ilgili dönem için geçerlidir.
- heading: Bilgilendirme
  paragraphs:
  - İşbu bildirim bilgilendirme amaçlıdır; [[spv_name]]'in ödeme planı kapsamındaki
    yükümlülükleri ayrıca iletilen ödeme planı belgelerinde yer almaktadır.
  - Sorularınız için [[counterparty]] kredi operasyonları birimiyle iletişime
    geçilmesi rica olunur.
