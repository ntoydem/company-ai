- heading: Teminat Mektubu
  paragraphs:
  - Sayın [[spv_name]], [[project_name]] kapsamında [[counterparty]] nezdinde
    bulunan ve [[guarantee_purpose]] amacıyla düzenlenmiş teminat mektubunun
    yenileme süreci hakkında aşağıdaki bilgiler sunulmaktadır.
  - İşbu bildirim [[document_no]] referans numarası ile [[document_date]]
    tarihinde düzenlenmiştir.
- heading: Yenileme
  paragraphs:
  - Söz konusu teminat mektubunun yenilenmesi [[guarantee_renewal_date]]
    döneminde planlanmaktadır. [[spv_name]]'in gerekli belgeleri ilgili tarihten
    önce [[counterparty]]'ye iletmesi gerekmektedir.
  - Yenileme işleminin tamamlanmasıyla birlikte güncel teminat mektubu
    [[spv_name]]'e ayrıca iletilecektir.
