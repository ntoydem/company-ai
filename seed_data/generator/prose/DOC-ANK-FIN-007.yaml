model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Purpose and Scope
  paragraphs:
  - This report, [[title]] (document number [[document_no]], [[version_label]]), is
    issued as of [[document_date]] and currently carries the status [[status_label]].
    It records the financial covenant position of [[spv_name]] in connection with
    [[project_name]].
  - The report is prepared for the information of [[counterparty_list]] and for internal
    review. It covers only the matters set out in the following sections and does
    not replace the underlying financing documentation.
- heading: 2. Compliance Summary
  paragraphs:
  - The debt service coverage ratio (DSCR) for the reporting period is [[dscr]]. This
    figure is presented as reported for the period and forms the basis of the covenant
    review.
  - The assessment is made against the covenant terms set out in the financing documentation.
    Any further detail on thresholds or testing methodology is to be read from that
    documentation and is not restated here.
- heading: 3. Outstanding Debt Position
  paragraphs:
  - The total facility amount drawn (utilised) under the loan is [[total_debt]]. This
    amount has been provided entirely by [[counterparty]] as the local bank.
  - The outstanding balance as of the reporting date is [[outstanding_debt]]. Each
    of the two figures is stated separately and under its own label, and neither is
    derived from the other in this report.
