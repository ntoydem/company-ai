sections:
- heading: Tadil Gerekçesi
  paragraphs:
  - '[[project_name]] projesi kapsamında [[parties_list]] tarafından yürütülen lisans
    süreçlerinde güncelleme ihtiyacı doğmuştur. [[spv_name]] ile [[counterparty]]
    arasında mutabık kalınan teknik değerlendirmeler sonucunda mevcut kapasitenin
    revize edilmesi uygun görülmüştür.'
  - Saha koşulları ve güncel teknik değerlendirmeler ışığında projenin verimliliğini
    artırmak amacıyla işbu [[document_no]] numaralı belgenin hazırlanması gerekmiştir.
    Yapılan düzenlemeler ilgili mevzuata ve tarafların ortak kararlarına uygun şekilde
    tasarlanmıştır.
- heading: Kapasite ve Türbin Sayısı Değişikliği
  paragraphs:
  - Proje başlangıcında [[capacity_mw_initial]] olan toplam kurulu güç kapasitesi,
    gerçekleştirilen tadil sonrasında [[capacity_mw]] seviyesine güncellenmiştir.
    Bu kapsamda başlangıçta planlanan [[turbine_count_initial]] adet türbin sayısı
    da [[turbine_count]] adet olarak yeniden düzenlenmiştir.
  - Yapılan teknik güncellemeler, projenin genel işletme düzenine ve ilgili lisans
    şartlarına entegre edilmiştir. Belirtilen parametre değişiklikleri [[title]] düzenlemesi
    altında kayıt altına alınarak [[version_label]] sürümü ile geçerlik kazanmıştır.
- heading: Yürürlük
  paragraphs:
  - İşbu lisans tadil metni [[amendment_date]] tarihinde düzenlenmiş olup [[effective_date]]
    itibarıyla yürürlüğe girecektir. Belge [[document_date]] tarihi itibarıyla imzalanarak
    taraflar arasında hukuki geçerlilik kazanmıştır.
  - Metin, genel sözleşme hükümleri çerçevesinde [[status_label]] statüsünde yürürlükte
    kalacak ve tarafların hak ile yükümlülüklerini belirlemeye devam edecektir. Önceki
    lisans koşullarının bu tadil ile çelişen hükümleri yürürlükten kaldırılmıştır.
