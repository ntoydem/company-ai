tag: AI_ASSUMPTION
sections:
- heading: 1. Hakkın Kapsamı
  paragraphs:
  - Bu taslak, [[title]] başlığıyla hazırlanmış olup [[project_name]] kapsamında ihtiyaç
    duyulan kira veya irtifak hakkının genel çerçevesini ortaya koymaktadır. Belge,
    [[spv_name]] adına düzenlenmiş olup [[document_no]] numaralı belge olarak kayıt
    altındadır. Mevcut sürüm [[version_label]] olarak, belgenin durumu ise [[status_label]]
    olarak belirtilmiştir.
  - Tesisin kurulumu, işletilmesi ve bakımı için gerekli kullanım hakkının kapsamı,
    nihai metinde taraflarca ayrıntılı biçimde belirlenecektir. Hakkın konusu, sınırları
    ve kullanım şekli bu taslakta kesinleştirilmiş sayılmamakta, imza aşamasına kadar
    müzakereye açık kalmaktadır.
  - Hakkın kullanımına ilişkin erişim, geçiş ve altyapı ihtiyaçları da nihai metinde
    değerlendirilecektir. Bu hususlara ilişkin somut hükümler, taraflar arasında mutabakata
    varıldıktan sonra sözleşmeye eklenecektir.
- heading: 2. Yürürlük ve Genel Hükümler
  paragraphs:
  - Bu belge, [[document_date]] tarihli bir taslak olup henüz imzalanmamıştır. Sözleşme,
    ancak taraflarca imzalanmak üzere hazırlanan nihai metnin usulüne uygun biçimde
    imzalanmasının ardından hüküm ifade edecektir. O ana kadar bu metin yalnızca görüşme
    ve inceleme amacını taşımaktadır.
  - Taslakta yer alan genel hükümler, taraflara ilişkin yükümlülüklerin, bildirim
    usullerinin, değişiklik esaslarının ve uyuşmazlıkların çözümüne dair yöntemlerin
    nihai metinde ayrıca ve ayrıntılı olarak düzenleneceği varsayımıyla kaleme alınmıştır.
    Bu hususlarda somut bir hüküm, taraflarca mutabık kalınmadan bu taslağa dayandırılmayacaktır.
  - Taslak üzerinde yapılacak her değişiklik yeni bir sürüm olarak kayda geçirilecektir.
    İmza öncesinde belgenin içeriği, ilgili tarafların onayına sunulacak ve gerekli
    görülen düzeltmeler yapıldıktan sonra imzaya hazır hale getirilecektir.
