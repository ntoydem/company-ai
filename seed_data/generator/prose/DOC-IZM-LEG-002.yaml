tag: AI_ASSUMPTION
sections:
- heading: 1. Hakkın Kapsamı
  paragraphs:
  - Bu taslak, [[document_no]] numaralı ve [[title]] başlıklı belge kapsamında, [[project_name]]
    için [[spv_name]] ile [[counterparty_list]] arasında imzalanması öngörülen kira
    ve irtifak hakkı düzenlemesinin çerçevesini içermektedir. Belge [[version_label]]
    sürümündedir ve [[document_date]] tarihlidir. Belgenin mevcut durumu [[status_label]]
    olarak belirtilmiştir.
  - Taslakta öngörülen hakların kapsamı, ilgili taşınmazların proje faaliyetleri için
    kullanımı ile bu kullanımın gerektirdiği geçiş ve irtifak ihtiyaçlarıyla sınırlı
    olacaktır. Hakkın hangi taşınmaz bölümlerini ve hangi kullanım biçimlerini kapsayacağı,
    taraflarca üzerinde mutabık kalınacak nihai metinde ayrıntılı olarak belirlenecektir.
  - '[[counterparty_list]], taşınmazlar üzerindeki mülkiyet haklarını muhafaza edecektir.
    [[spv_name]] ise yalnızca imzalanacak sözleşmede açıkça tanınan haklara sahip
    olacaktır. Bu taslak, tarafların nihai iradesini yansıtmamakta olup müzakere sürecinde
    değiştirilebilecektir.'
- heading: 2. Yürürlük ve Genel Hükümler
  paragraphs:
  - Bu belge bir taslaktır ve henüz imzalanmamıştır. Taslaktaki hükümler, ancak [[spv_name]]
    ile [[counterparty_list]] tarafından imzalanacak nihai metinle taraflar bakımından
    hüküm doğurabilecektir. Bu nedenle mevcut metin, taraflar için herhangi bir hak
    veya yükümlülük oluşturmamaktadır.
  - Sözleşmenin süresi, bedeli, ödeme esasları, sona erme halleri ve uyuşmazlıkların
    çözüm yöntemi gibi hususlar, taraflarca nihai metinde belirlenecektir. Bu hususlara
    ilişkin hükümler, taslak aşamasında bağlayıcı bir düzenleme olarak değerlendirilmemelidir.
  - Sözleşme metninde yapılacak her değişiklik ve ek, tarafların karşılıklı mutabakatıyla
    ve yazılı olarak düzenlenecektir. Belgenin son hâli, imza için hazırlandığında
    ilgili tüm taraflara ayrıca iletilecektir.
