tag: AI_ASSUMPTION
sections:
- heading: 1. Hakkın Kapsamı
  paragraphs:
  - Bu belge, [[title]] başlığını taşıyan, [[document_no]] numaralı ve [[version_label]]
    sürümlü bir taslaktır. Belge [[document_date]] tarihini taşımakta olup mevcut
    durumu [[status_label]] olarak belirtilmiştir. Taslak henüz imzalanmamıştır ve
    yalnızca değerlendirme ile müzakere amacıyla hazırlanmıştır.
  - Taslağa göre [[spv_name]] lehine, [[project_name]] kapsamında kullanılacak taşınmazlar
    üzerinde kira veya irtifak hakkı tesis edilmesi öngörülmektedir. Söz konusu taşınmazların
    malikleri [[parties_list]] olarak belirtilmiştir. Hakkın türü ve niteliği, taraflarca
    yürütülecek müzakerelerin sonucunda nihai metinde belirlenecektir.
  - Hakkın kullanımının, proje için gerekli faaliyetlerle sınırlı tutulması öngörülmektedir.
    Kullanım alanının sınırları, geçiş ve erişim ihtiyaçları ile maliklerin taşınmazlar
    üzerindeki diğer hakları imzalanacak nihai metinde ayrıntılı olarak düzenlenecektir.
- heading: 2. Yürürlük ve Genel Hükümler
  paragraphs:
  - Bu taslak imzalanmadığı sürece taraflar bakımından herhangi bir hak veya yükümlülük
    doğurmayacaktır. Sözleşmenin yürürlüğe gireceği an ve koşullar, imza aşamasında
    taraflarca birlikte belirlenecektir. Taslakta yer alan ifadeler müzakere sürecinde
    değiştirilebilir.
  - Nihai metne ilişkin değişikliklerin ve bildirimlerin yazılı olarak yapılması öngörülmektedir.
    Tarafların hak ve yükümlülüklerine ilişkin ayrıntılar, [[spv_name]] ile [[parties_list]]
    arasında mutabık kalınacak esaslara göre düzenlenecektir.
  - Sözleşmeden doğabilecek uyuşmazlıkların öncelikle taraflar arasında karşılıklı
    görüşme yoluyla çözülmesi hedeflenmektedir. Uyuşmazlık çözümüne ilişkin usul ve
    esaslar nihai metinde taraflarca kararlaştırılacaktır. Bu belge, kurgusal bir
    demo çalışması kapsamında hazırlanmış olup gerçek bir hukuki işlem niteliği taşımamaktadır.
