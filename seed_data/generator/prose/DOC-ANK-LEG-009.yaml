sections:
- heading: E-posta İçeriği
  paragraphs:
  - Sayın Meslektaşım, [[court]] önünde görülmekte olan [[case_number]] sayılı dosyaya
    ilişkin genel bir güncelleme paylaşmak amacıyla yazıyorum. Bu e-posta, [[opposing_counsel_email_date]]
    tarihinde [[defendant]] vekili sıfatıyla tarafınıza iletilmiştir.
  - Dosyanın [[project_name]] kapsamındaki mevcut durumu [[status_label]] olarak takip
    edilmektedir. Bu yazıda yeni bir talep, iddia veya belge sunulmamakta, yalnızca
    dosyanın genel seyri hakkında bilgi verilmektedir.
  - Süreçle ilgili yazışmaların düzenli biçimde kayıt altında tutulması için bu e-posta,
    [[title]] başlıklı belge olarak [[document_no]] numarasıyla ve [[version_label]]
    sürümüyle, [[document_date]] tarihi itibarıyla muhafaza edilmektedir. Dosyaya
    ilişkin görüşlerinizi ve eklemek istediğiniz hususları paylaşmanızı rica ederim.
  - Saygılarımla, [[defendant]] Vekili
