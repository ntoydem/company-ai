tag: AI_ASSUMPTION
sections:
- heading: Politika Kapsamı
  paragraphs:
  - Bu politika, [[title]] başlığıyla [[document_no]] numaralı belge olarak hazırlanmıştır
    ve [[document_date]] tarihlidir. Belge, [[version_label]] sürümü olarak düzenlenmiş
    olup mevcut durumu [[status_label]] şeklindedir.
  - Politika, [[spv_name]] bünyesindeki tüm kurumsal yönetim ve uyum faaliyetlerini
    kapsar. Taraflar olarak [[parties_list]] bu politikanın ilgili hükümlerine uygun
    hareket etmeyi kabul eder.
  - Politikanın amacı; şeffaflık, hesap verebilirlik, dürüstlük ve mevzuata uygunluk
    ilkelerinin kurumsal faaliyetlerin tamamında gözetilmesini sağlamaktır. Bu çerçeve,
    ilgili tüm birimler ve çalışanlar için bağlayıcı bir referans niteliği taşır.
- heading: Uygulama
  paragraphs:
  - Bu politika, [[effective_date]] tarihinde yürürlüğe girer ve aksi yazılı olarak
    belirtilmedikçe yürürlükte kalır. Politikanın uygulanmasından ilgili yönetim organları
    ve uyum sorumluları birlikte sorumludur.
  - Taraflar, politikanın gereklerini yerine getirmek için makul ve uygun tüm tedbirleri
    alır. Politikaya aykırılık şüphesi doğduğunda ilgili durum gecikmeden yetkili
    birimlere bildirilir ve gerekli inceleme usulüne uygun biçimde yürütülür.
  - Politikada yapılacak değişiklikler yazılı olarak hazırlanır ve ilgili onay süreçlerinden
    geçirilir. Güncel sürüm, [[document_no]] numaralı belge kaydı üzerinden takip
    edilir ve ilgili taraflarla paylaşılır.
