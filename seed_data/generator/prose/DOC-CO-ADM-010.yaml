sections:
- heading: Karar Gerekçesi
  paragraphs:
  - İşbu karar, [[spv_name]] bünyesinde uygulanacak kâr dağıtım politikasının belirlenmesi
    amacıyla alınmıştır. Karar, [[document_no]] numaralı ve [[title]] başlıklı belge
    kapsamında, [[document_date]] tarihi itibarıyla hazırlanmıştır.
  - Pay sahipleri, şirketin finansal sürdürülebilirliğinin korunması ile yatırımcı
    beklentilerinin dengelenmesi gerektiği hususunda mutabık kalmıştır. Bu çerçevede
    dağıtım esaslarının açık, öngörülebilir ve şeffaf bir yapıya kavuşturulması gerekli
    görülmüştür.
  - Karara taraf olan pay sahipleri [[parties_list]] olarak belirlenmiştir. Belgenin
    güncel durumu [[status_label]], sürümü ise [[version_label]] olarak kayda geçirilmiştir.
- heading: Alınan Karar
  paragraphs:
  - Pay sahipleri, şirketin kâr dağıtımına ilişkin esasların işbu politika çerçevesinde
    yürütülmesine oybirliği ile karar vermiştir. Dağıtım kararları, şirketin mali
    durumu, nakit ihtiyaçları ve yükümlülükleri gözetilerek ilgili yetkili organlarca
    alınacaktır.
  - Politika, [[effective_date]] tarihinde yürürlüğe girecektir. Yürürlük tarihinden
    itibaren yapılacak tüm dağıtımlar bu politikaya uygun olarak değerlendirilecektir.
  - Politikada yapılacak değişiklikler, pay sahiplerinin yeni bir kararı ile gerçekleştirilecektir.
    İşbu karar, ilgili mevzuat ve şirketin kurucu belgeleri ile uyumlu biçimde uygulanacaktır.
