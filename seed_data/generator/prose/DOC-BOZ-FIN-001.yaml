doc_id: DOC-BOZ-FIN-001
model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Recitals
  paragraphs:
  - This Facility Agreement, identified as [[document_no]] and titled [[title]], is
    dated [[document_date]] and is made in respect of the [[project_name]]. It is
    entered into by [[parties_list]] and forms part of the financing documentation
    for the project.
  - The plant reached commercial operation on [[cod_actual]], before this Facility
    came into existence. The Facility, in a total amount of [[total_debt]], was signed
    on [[signed_date]] and is not a construction loan.
  - This Agreement takes effect on [[effective_date]]. The current version is [[version_label]]
    and its status is [[status_label]].
- heading: 2. The Facility
  paragraphs:
  - The Facility is made available in a total amount of [[total_debt]] to [[spv_name]]
    by [[counterparty_list]]. Its tenor is [[tenor_years]] years from the effective
    date.
  - Interest accrues on the Facility at an effective rate of [[effective_rate_pct_en]].
  - A debt service reserve account is maintained with a balance of [[dsra_balance]],
    a fixed amount equal to six periods of debt service.
- heading: 3. Repayment
  paragraphs:
  - 'The Facility shall be repaid in accordance with the following repayment structure:
    [[repayment_profile_en]].'
  - Repayment is made in line with that structure and the other terms of this Agreement.
- heading: 4. Financial Covenants
  paragraphs:
  - The Borrower undertakes to maintain a debt service coverage ratio of not less
    than [[dscr_covenant]]. This is a minimum requirement applicable throughout the
    life of the Facility.
  - Compliance with this covenant is to be assessed in the manner contemplated by
    the financing documentation.
- heading: 5. Governing Law
  paragraphs:
  - This Agreement is governed by [[governing_law]].
