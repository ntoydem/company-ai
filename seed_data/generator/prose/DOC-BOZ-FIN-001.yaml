model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: 1. Recitals
  paragraphs:
  - This Agreement, identified as [[document_no]] and titled [[title]], is made between
    [[parties_list]]. It relates to the [[project_name]] and is issued as [[version_label]]
    with the status [[status_label]].
  - The [[project_name]] reached commercial operation on [[cod_actual]], before this
    Facility came into existence. The Facility, in the total amount of [[total_debt]],
    was signed on [[signed_date]], after the plant had been completed.
  - This Agreement takes effect on [[effective_date]] and is dated [[document_date]].
- heading: 2. The Facility
  paragraphs:
  - Under this Agreement, the lenders make available to [[spv_name]] a term facility
    in the total amount of [[total_debt]]. The tenor of the Facility is [[tenor_years]]
    years.
  - The interest rate applicable to the Facility is [[effective_rate_pct_en]]. Interest
    is payable in accordance with the terms of this Agreement.
  - A debt service reserve account is maintained with a balance of [[dsra_balance]],
    a fixed amount equal to six periods of debt service.
- heading: 3. Repayment
  paragraphs:
  - 'The Facility shall be repaid in accordance with the following structure: [[repayment_profile_en]].'
  - Each repayment is due on the terms and in the manner set out in this Agreement.
    The repayment structure above applies throughout the tenor of the Facility.
- heading: 4. Financial Covenants
  paragraphs:
  - 'The borrower shall maintain a debt service coverage ratio of not less than the
    minimum requirement set out as follows: [[dscr_covenant]].'
  - Compliance with this covenant is assessed in accordance with the testing provisions
    of this Agreement. This section sets out the minimum requirement only.
- heading: 5. Governing Law
  paragraphs:
  - This Agreement is governed by [[governing_law]].
