tag: AI_ASSUMPTION
sections:
- heading: Risk Değerlendirmesi
  paragraphs:
  - Bu belge, [[title]] başlığıyla hazırlanmıştır ve [[document_no]] numaralı, [[version_label]]
    sürümlü bir kayıt niteliği taşır. Belge [[document_date]] tarihi itibarıyla düzenlenmiş
    olup mevcut durumu [[status_label]] olarak izlenmektedir.
  - Risk değerlendirmesi, [[parties_list]] kapsamındaki yapıların faaliyetlerini genel
    bir çerçevede ele alır. Değerlendirme; operasyonel, finansal, hukuki ve itibar
    boyutlarındaki başlıca risk alanlarını kapsar.
  - '[[spv_name]] bakımından riskler, grup düzeyindeki risk yönetimi ilkeleri doğrultusunda
    ayrıca izlenir. Somut risk düzeyleri bu belgede sayısal olarak belirtilmez ve
    ilgili iç raporlarda ayrıca ele alınır.'
- heading: Sonuç
  paragraphs:
  - Tanımlanan risklerin mevcut kontrol mekanizmaları çerçevesinde yönetilebilir olduğu
    değerlendirilmektedir. Bu görüş, [[document_date]] tarihindeki bilgilere dayanmaktadır.
  - Bu belge [[document_no]] numarasıyla kayıt altındadır ve içeriği periyodik olarak
    gözden geçirilecektir. Güncelleme yapıldığında [[version_label]] bilgisi ve [[status_label]]
    ifadesi buna göre revize edilir.
