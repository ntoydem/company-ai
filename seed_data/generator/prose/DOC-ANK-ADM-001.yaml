model: claude-sonnet-5-5
tag: AI_ASSUMPTION
sections:
- heading: Bütçe Kapsamı
  paragraphs:
  - Bu belge, [[spv_name]] tarafından yürütülen [[project_name]] kapsamındaki yıllık
    işletme bütçesinin onayına ilişkindir. Belge, [[document_no]] numarası ve [[version_label]]
    sürüm bilgisiyle kayıt altına alınmış olup [[document_date]] tarihini taşımaktadır.
  - Bütçe, projenin olağan işletme faaliyetlerinden doğan gider kalemlerini ve bu
    faaliyetlerin sürdürülebilmesi için öngörülen kaynak ihtiyaçlarını kapsar. Kapsama
    dahil olmayan kalemler, ilgili taraflarca ayrıca değerlendirilir ve gerektiğinde
    ek onaya sunulur.
  - Bu bütçe, [[parties_list]] tarafından mutabık kalınan esaslar çerçevesinde hazırlanmıştır.
    Bütçenin uygulanmasında şeffaflık, hesap verebilirlik ve kaynakların amacına uygun
    kullanımı ilkeleri esas alınır.
- heading: Onay
  paragraphs:
  - Bu bütçe, [[title]] başlıklı belge kapsamında taraflarca incelenmiş ve belgenin
    güncel durumu [[status_label]] olarak kayıtlara geçirilmiştir. Bütçe, [[effective_date]]
    tarihinden itibaren yürürlüğe girer.
  - Onaylanan bütçede yapılacak esaslı değişiklikler, ilgili tarafların mutabakatına
    tabidir ve yazılı olarak belgelendirilir. Bu belge, ilgili sözleşmesel düzenlemelerle
    birlikte değerlendirilir ve söz konusu düzenlemelere aykırı bir hüküm doğurmaz.
