tag: AI_ASSUMPTION
sections:
- heading: Ruhsat Kapsamı
  paragraphs:
  - İşbu belge, [[project_name]] projesine ilişkin olarak [[spv_name]] unvanlı kuruluş
    adına düzenlenmiştir. [[counterparty]] tarafından onaylanan bu ruhsat, ilgili
    mevzuat çerçevesinde yürütülecek tüm faaliyetleri kapsamaktadır.
  - Projenin gerçekleştirileceği sahalar ve tesis özellikleri, [[document_no]] numaralı
    evrakta detaylandırıldığı şekildedir. [[parties_list]] arasında mutabık kalınan
    teknik kriterler harfiyen uygulanacaktır.
- heading: Yürürlük
  paragraphs:
  - İşbu yapı ruhsatı, [[document_date]] tarihinde imzalanmış olup [[effective_date]]
    itibarıyla resmiyet kazanmıştır. [[version_label]] sürümü ile güncellenen metin
    hükümleri eksiksiz olarak tatbik edilecektir.
  - Belirtilen [[status_label]] durumu süresince tüm taraflar yükümlülüklerini eksiksiz
    yerine getirmekle mükelleftir. [[title]] unvanına sahip yetkili makamlar sürecin
    takibinden sorumludur.
