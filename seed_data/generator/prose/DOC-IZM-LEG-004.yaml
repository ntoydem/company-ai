tag: AI_ASSUMPTION
sections:
- heading: Değerlendirme Kapsamı
  paragraphs:
  - Bu değerlendirme, [[title]] başlıklı ve [[document_no]] numaralı belge kapsamında,
    [[project_name]] için yürütülen önlisans süre uzatımı talebinin hukuki çerçevesini
    ele almaktadır. Belge [[document_date]] tarihlidir ve [[version_label]] sürümü
    olarak [[status_label]] durumundadır.
  - Projenin önlisans tarihi [[pre_licence_date]]'dir. Süre uzatımına ilişkin değerlendirme,
    bu tarihten itibaren işleyen sürecin idari ve sözleşmesel sonuçlarıyla sınırlıdır.
  - Proje şirketi [[spv_name]]'dir. Karşı taraf olarak [[counterparty]] bakımından
    doğabilecek etkiler yalnızca genel düzeyde ele alınmıştır.
- heading: Sonuç
  paragraphs:
  - Yapılan inceleme sonucunda, süre uzatımı talebinin ilgili mevzuat ve sözleşme
    hükümleri çerçevesinde değerlendirilmesi gerektiği kanaatine varılmıştır. Talebin
    sonuçları, uygulanabilir hükümlere göre ayrıca teyit edilmelidir.
  - '[[parties_list]] sürecin gerektirdiği bildirimleri ve belgeleri hazırlamaktan
    sorumludur. Bu belge, [[counterparty_list]] ile yürütülecek sonraki görüşmeler
    için genel bir dayanak oluşturur.'
