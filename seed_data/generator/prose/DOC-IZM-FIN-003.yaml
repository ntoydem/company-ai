sections:
- heading: Fatura Bilgileri
  paragraphs:
  - "[[counterparty]], [[spv_name]] adına [[project_name]] kapsamındaki EPC
    sözleşmesi avans ödemesi için [[advance_invoice_no]] numaralı faturayı
    düzenlemiştir. Fatura tutarı [[advance_amount]]'dır (KDV dahil)."
  - Bu fatura [[document_no]] referans numarası ile [[document_date]]
    tarihinde düzenlenmiştir.
- heading: Ödeme Koşulları
  paragraphs:
  - Faturaya itiraz süresi [[advance_invoice_dispute_deadline]] tarihinde
    sona ermektedir. Ödeme vadesi [[advance_invoice_due_date]] olarak
    belirlenmiştir.
  - Ödemenin [[counterparty]] tarafından bildirilen banka hesabına
    yapılması gerekmektedir.
