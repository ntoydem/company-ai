sections:
- heading: Poliçe Bilgileri
  paragraphs:
  - Sayın [[spv_name]], [[project_name]] kapsamındaki [[insurance_policy_no]]
    numaralı sigorta poliçesine ilişkin aşağıdaki zeyilname düzenlenmiştir.
  - Bu zeyilname [[document_no]] referans numarası ile [[document_date]]
    tarihinde düzenlenmiştir.
- heading: Zeyilname
  paragraphs:
  - İşbu zeyilname bir yenileme işlemi değildir; poliçenin ara dönem
    güncellemesidir. Poliçenin geçerlilik süresi [[insurance_expiry]]
    tarihine kadardır.
  - Poliçe şartlarının diğer tüm hükümleri değişiklik olmaksızın
    geçerliliğini sürdürmektedir.
