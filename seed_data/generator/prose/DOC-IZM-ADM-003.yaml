sections:
- heading: Maliyet Kapsamı
  paragraphs:
  - Bu not, [[project_name]] kapsamında geliştirme aşamasında oluşan maliyetlerin
    takibine ilişkin genel çerçeveyi ortaya koymaktadır. Belge, [[document_no]] numarası
    ve [[version_label]] sürümü ile [[document_date]] tarihinde hazırlanmış olup güncel
    durumu [[status_label]] olarak belirtilmiştir.
  - Takip edilen maliyet kalemleri, proje şirketi [[spv_name]] adına yürütülen geliştirme
    faaliyetleriyle sınırlıdır. Bu kalemler; etüt, izin ve ruhsat süreçleri, danışmanlık
    hizmetleri ile idari giderler gibi geliştirme aşamasına özgü harcamaları kapsayacak
    şekilde ele alınmaktadır.
  - Maliyetlere ilişkin sorumluluk dağılımı ve ilgili hususlar, [[parties_list]] arasında
    yürütülen mutabakat çerçevesinde izlenmektedir. Her bir kalemin kapsamı, ilgili
    belgelerde yer alan esaslara uygun biçimde değerlendirilmektedir.
- heading: Değerlendirme
  paragraphs:
  - '[[title]] başlıklı bu not, geliştirme aşamasındaki maliyet gelişimine ilişkin
    genel bir değerlendirme sunmak amacıyla hazırlanmıştır. Maliyet kalemlerinin izlenmesi,
    proje ilerledikçe düzenli olarak gözden geçirilecek ve gerekli görüldüğünde güncellenecektir.'
  - Belgede yer alan bilgiler, mevcut verilere dayanmakta olup ilgili taraflarca yapılacak
    ek inceleme ve onay süreçlerine tabidir. Maliyet takibinde tespit edilen sapmalar
    veya belirsizlikler, ilgili taraflara bildirilerek uygun yöntemlerle ele alınacaktır.
  - Bu doküman yalnızca bilgilendirme amacıyla düzenlenmiş kurgusal bir demo belgesidir.
    Sonraki sürümlerde, proje ilerlemesine bağlı olarak kapsam ve içerik yeniden değerlendirilebilir.
