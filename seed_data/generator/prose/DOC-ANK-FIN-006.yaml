sections:
- heading: 1. Background
  paragraphs:
  - This amendment agreement is entered into as of [[document_date]] by and between
    [[parties_list]] regarding the financing of [[project_name]].
  - The primary obligor, [[spv_name]], together with [[counterparty]], previously
    executed the primary financing documents under reference [[document_no]].
  - The current operational status is designated as [[status_label]] pursuant to the
    latest compliance review under version [[version_label]]. Financial close under the
    original agreement was achieved on [[financial_close_date]].
- heading: 2. Amendments to the Original Agreement
  paragraphs:
  - The parties hereby agree to modify the financial covenants, specifically updating
    the minimum debt service coverage ratio (DSCR) to [[dscr_covenant]] with effect from
    [[effective_date]].
  - Furthermore, the applicable interest margin over the baseline index is adjusted
    to [[margin_pct]].
  - All references to the designated [[title]] within the principal clauses are amended
    accordingly to reflect these structural adjustments.
- heading: 3. Continuing Effect
  paragraphs:
  - Except as expressly modified by this document, the original terms and conditions
    shall remain in full force and effect from [[effective_date]].
  - Each party confirms that all prior obligations and security packages continue
    to bind the respective entities without interruption.
  - This instrument shall be read and construed as one with the initial facility agreement
    executed by [[parties_list]].
- heading: 4. Representations
  paragraphs:
  - '[[spv_name]] hereby reaffirms all corporate representations and warranties previously
    provided under the financing framework.'
  - '[[counterparty]] acknowledges that no event of default has occurred and is continuing
    as of [[effective_date]].'
  - The signatories warrant that they possess full legal authority to bind their respective
    organizations to these updated terms.
- heading: 5. Governing Law
  paragraphs:
  - This amendment document is governed by and shall be construed in accordance with
    the applicable laws governing [[project_name]].
  - Any disputes arising from the interpretation of these modifications shall be submitted
    to the exclusive jurisdiction defined in [[document_no]].
