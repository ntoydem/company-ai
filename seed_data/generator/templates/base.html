<!DOCTYPE html>
<html lang="{{ facts.language }}">
<head>
<meta charset="utf-8">
<title>{{ facts.title }}</title>
<style>
  @page {
    size: A4;
    margin: 2.2cm 2cm 2.4cm 2cm;
    @bottom-center {
      content: "{{ footer_text }} " counter(page) " / " counter(pages);
      font-size: 8pt;
      color: #888;
    }
  }
  body {
    font-family: "DejaVu Serif", Georgia, serif;
    font-size: 10.5pt;
    line-height: 1.45;
    color: #1a1a1a;
  }
  .watermark {
    position: fixed;
    top: 45%;
    left: 8%;
    width: 84%;
    text-align: center;
    font-family: "DejaVu Sans", Helvetica, sans-serif;
    font-size: 90pt;
    font-weight: bold;
    color: rgba(200, 30, 30, 0.16);
    transform: rotate(-32deg);
    z-index: -1;
  }
  .doc-page { page-break-after: always; }
  .doc-page:last-child { page-break-after: avoid; }
  .cover h1 { font-size: 19pt; text-align: center; margin-top: 2.5cm; }
  .cover h2 { font-size: 12.5pt; text-align: center; font-weight: normal; color: #444; }
  .cover .meta {
    margin-top: 2cm;
    width: 78%;
    margin-left: auto;
    margin-right: auto;
    border-top: 1px solid #999;
    padding-top: 0.6cm;
  }
  .cover .meta dt { font-weight: bold; }
  .cover .meta dl { display: grid; grid-template-columns: 38% 62%; row-gap: 0.3cm; }
  .banner {
    text-align: center;
    font-family: "DejaVu Sans", Helvetica, sans-serif;
    font-weight: bold;
    letter-spacing: 0.1em;
    color: #a11;
    margin-top: 1.1cm;
    font-size: 9pt;
  }
  .banner.secondary { margin-top: 0.25cm; font-size: 8pt; }
  h2.section-title {
    font-family: "DejaVu Sans", Helvetica, sans-serif;
    font-size: 13pt;
    border-bottom: 1pt solid #333;
    padding-bottom: 0.2cm;
  }
  p { text-align: justify; margin: 0 0 0.5em 0; }
  table.data-table { width: 100%; border-collapse: collapse; margin-top: 0.5cm; font-size: 9.5pt; }
  table.data-table th, table.data-table td { border: 1px solid #999; padding: 0.16cm 0.25cm; text-align: left; }
  table.data-table th { background: #eee; font-family: "DejaVu Sans", Helvetica, sans-serif; }
  .signature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1cm; margin-top: 1.2cm; }
  .signature-box { border-top: 1pt solid #333; padding-top: 0.2cm; font-size: 9.5pt; }
  .letterhead { text-align: right; font-size: 9.5pt; color: #333; margin-bottom: 0.8cm; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
