# Company AI V0 — single compose project for dev and prod.
# Invoked from the repo root via the Makefile:
#   docker compose --project-directory . -f infra/docker-compose.yml --env-file .env
# Relative paths below therefore resolve against the repo root.
name: company-ai

services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-company_ai}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-company_ai}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No host port: access with `make psql` (SPEC_06 §6).

  backend:
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-company_ai}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/company_ai_test
      APP_DATA_DIR: /data
      # Re-stated from .env so a shell-level override (`make eval MODEL=...`, Phase 4.1)
      # makes compose recreate this service; `env_file` alone is not diffed for changes.
      LLM_MODEL_ANSWER: ${LLM_MODEL_ANSWER}
    volumes:
      - ./backend:/app
      - ./seed_data:/app/seed_data
      - ./scripts:/app/scripts
      - ${DATA_ROOT}/documents:/data/documents
      - ${DATA_ROOT}/excel:/data/excel
      - ${DATA_ROOT}/app-data:/data/app-data
    # No host port since Phase 3.3 (ADR-018): reachable only as backend:8000 inside the
    # compose network; the host talks to Caddy (${CADDY_PORT}).
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ocrmypdf + PyMuPDF ingestion worker (Phase 0.2, ADR-006). Own pyproject/tests —
  # does not import backend/app; reads the schema via MetaData().reflect().
  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: ../infra/ocr-worker/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-company_ai}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/company_ai_test
      APP_DATA_DIR: /data
    volumes:
      - ./ocr-worker:/worker
      - ${DATA_ROOT}/documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 3.3: React bundle (built into the image) + /api reverse proxy. The only
  # host-facing entry point; part of the default `make up`. Since 30.09.2026 the bundle
  # source is AI-BalBal (git submodule frontend-balbal/); FRONTEND_DIR=./frontend rolls
  # back to the retired company-ai frontend with the same Dockerfile.
  caddy:
    build:
      context: ./infra/caddy
      additional_contexts:
        src: ${FRONTEND_DIR:-./frontend-balbal/frontend}
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-8080}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT}/app-data/caddy:/data
    depends_on:
      backend:
        condition: service_healthy

  # Tooling only (profile "tools", never `up`): `make lint` (eslint + tsc) and
  # `make dev-frontend` (Vite HMR on :5173, proxying /api to backend:8000).
  frontend:
    profiles: ["tools"]
    build:
      context: ./frontend
    environment:
      VITE_DEV_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  # Build-time only (profile "tools", Phase 4.2): LibreOffice headless recalculates the
  # formulas of the generated demo workbooks so their cached values exist (openpyxl writes
  # formulas, never values). Never used at runtime — the backend image stays LibreOffice-free.
  libreoffice:
    profiles: ["tools"]
    build:
      context: ./infra/libreoffice
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./seed_data:/seed_data
    working_dir: /seed_data
    entrypoint: ["/bin/bash", "/seed_data/generator/recalc.sh"]

  # --- Placeholder: Phase 3.4 (bge-m3 embeddings, needs 16 GB VM) ---
  embed:
    profiles: ["full"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command: ["--model-id", "${EMBED_MODEL_ID:-BAAI/bge-m3}", "--port", "8080"]
    volumes:
      - ${DATA_ROOT}/app-data/models:/data
    # No host port: reachable only as http://embed:8080 inside the compose network.
